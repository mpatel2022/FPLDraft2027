[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-draft-dash"
version = "0.1.0"
description = "Dash dashboard for FPL Draft 2025/26"
readme = "README.md"
authors = [ { name = "FPL Draft" } ]
license = { text = "MIT" }

# Minimal runtime dependencies (pinned to the environment used)
dependencies = [
    "pandas==2.2.2",
    "numpy==2.0.1",
    "dash==3.1.1",
    "dash-bootstrap-components==2.0.3",
    "dash-table==5.0.0",
    "plotly==6.2.0",
    "colorlover==0.3.0",
    "requests==2.32.3",
    "PyYAML==6.0.2",
    "truststore==0.10.4",
]
